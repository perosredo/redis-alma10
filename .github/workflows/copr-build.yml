name: Bump spec to upstream release and build in COPR

on:
  schedule:
    # Check daily for new upstream releases
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: Trigger a COPR build even if the spec is already current
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

env:
  UPSTREAM_REPO: redis/redis
  # Only follow patch releases of this series; moving to a new series is a manual change here
  SERIES: "8.10"
  SPEC: contrib/redis.spec
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  bump-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Compare spec version with latest upstream release in series
        id: check
        run: |
          TAGS=$(gh api "repos/$UPSTREAM_REPO/releases?per_page=100" --jq '.[] | select(.prerelease | not) | .tag_name')
          LATEST=$(echo "$TAGS" | grep -E "^${SERIES//./\\.}\.[0-9]+$" | sort -V | tail -1)
          NEWEST=$(echo "$TAGS" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          CURRENT=$(awk '/^%global upstream_ver/ {print $3; exit}' "$SPEC")
          echo "series=$SERIES upstream=$LATEST spec=$CURRENT newest-overall=$NEWEST"
          if [ -z "$LATEST" ]; then
            echo "::error::No upstream release found for series $SERIES"
            exit 1
          fi
          if [ "${NEWEST%.*}" != "$SERIES" ]; then
            echo "::warning::Newer Redis series available: $NEWEST (tracking $SERIES)"
          fi
          if [ "$LATEST" = "$CURRENT" ]; then
            echo "Already at $CURRENT, nothing to do"
          else
            echo "version=$LATEST" >> "$GITHUB_OUTPUT"
          fi

      - name: Update spec, commit and push
        if: steps.check.outputs.version
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          sed -i -E "s/^(%global upstream_ver[[:space:]]+).*/\1$VERSION/; s/^(Release:[[:space:]]*)[0-9]+/\11/" "$SPEC"
          sed -i "/^%changelog/a * $(date '+%a %b %d %Y') Petar Sredojevic <petar@sredojevic.ca> - $VERSION-1\n- Update to upstream $VERSION (automated)\n" "$SPEC"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update redis to $VERSION"
          git push

      - name: Trigger COPR build
        if: steps.check.outputs.version || inputs.force_build
        env:
          COPR_WEBHOOK: ${{ secrets.COPR_WEBHOOK }}
        run: curl --fail --silent --show-error -X POST "$(printf '%s' "$COPR_WEBHOOK" | tr -d '[:space:]')"

      # Scheduled workflows get disabled after 60 days without repo activity;
      # re-enabling on every run resets that timer.
      - name: Keepalive
        if: always()
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/copr-build.yml/enable"
